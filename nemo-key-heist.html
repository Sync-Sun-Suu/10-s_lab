<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#d6ebe7;color:#234d50;font-family:system-ui,-apple-system,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}header{position:absolute;z-index:2;top:max(18px,env(safe-area-inset-top));left:20px;pointer-events:none}h1{margin:0;font-size:clamp(16px,3vw,22px);font-weight:700;letter-spacing:.06em}header p{font-size:10px;letter-spacing:.08em;margin:6px 0;opacity:.68}.hud{position:absolute;z-index:2;top:max(18px,env(safe-area-inset-top));right:18px;display:grid;gap:5px;justify-items:end;pointer-events:none}.pill{padding:7px 11px;background:#ffffffb8;border:1px solid #ffffffd4;border-radius:20px;font-size:10px;box-shadow:0 4px 18px #385f5810}.pill strong{color:#b67922}.message{position:absolute;z-index:2;left:50%;top:15%;transform:translateX(-50%);width:min(440px,calc(100% - 40px));padding:10px 16px;background:#164d50dc;color:#fff;border-radius:30px;text-align:center;font-size:12px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}.message.show{opacity:1;transform:translate(-50%,6px)}.instructions{position:absolute;z-index:2;bottom:max(91px,calc(env(safe-area-inset-bottom) + 72px));left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 28px);padding:8px 13px;border-radius:18px;background:#ffffffb3;font-size:11px;text-align:center;pointer-events:none}footer{position:absolute;z-index:3;bottom:max(17px,env(safe-area-inset-bottom));left:0;width:100%;padding:0 14px;display:flex;justify-content:center;gap:8px}button,a.control{min-height:44px;border:1px solid #ffffffce;border-radius:30px;background:#ffffffe8;color:#244e50;padding:0 16px;font:inherit;font-size:12px;font-weight:650;cursor:pointer;box-shadow:0 4px 18px #385f5818;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button.active{background:#285e62;color:white;border-color:#285e62}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #f6a34a;outline-offset:3px}.win{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:22px;background:#09282fc4;backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}.win.show{opacity:1;visibility:visible;transition:opacity .5s}.card{width:min(480px,100%);padding:clamp(28px,7vw,48px);border-radius:30px;background:linear-gradient(150deg,#fffdf3,#e8f3ef);text-align:center;box-shadow:0 35px 100px #08262f80}.key{width:112px;margin:auto;line-height:1;filter:drop-shadow(0 12px 13px #9f70294f);animation:float 2.2s ease-in-out infinite}.key svg{display:block;width:100%;height:auto}.card .tag{margin:20px 0 8px;color:#b4771d;font-size:9px;font-weight:800;letter-spacing:.2em;text-transform:uppercase}.card h2{margin:0;color:#193f43;font:700 clamp(28px,8vw,44px)/1.08 Georgia,serif;letter-spacing:-.04em}.card p{margin:15px auto 24px;max-width:320px;color:#527174;font-size:13px}.card .actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.card a.control{background:#e9ae47;color:#172f34;border-color:#e9ae47}.card button{border-color:#b4cfca;background:transparent}@keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}@media(max-width:490px){header p{max-width:170px;line-height:1.5}.hud{top:max(74px,calc(env(safe-area-inset-top) + 55px))}.message{top:24%}footer{gap:5px}button,a.control{padding:0 12px;font-size:11px}.instructions{font-size:10px}.card{border-radius:24px}}@media(prefers-reduced-motion:reduce){.key{animation:none}.message,.win{transition:none}}
</style>
<style>
/* 10718 aquarium — softer, smaller, stranger */
body{color:#40566c;background:#dff1f2}
header h1{color:#29485a;text-shadow:0 1px 0 #fff8}header p{color:#7e7089;opacity:1}
.pill{background:#fffaf1d9;border-color:#fff;color:#6a6076;box-shadow:0 7px 24px #86779820}.pill strong{color:#c78830}.message{background:linear-gradient(110deg,#706080e8,#476e79e8);box-shadow:0 10px 30px #4c62742b}.instructions{background:#fffaf0e8;color:#706078;border:1px solid #fff;box-shadow:0 8px 24px #77708c18}
button,a.control{background:#fffaf1f2;color:#526575;border-color:#fff;box-shadow:0 7px 24px #6d7c8b1c}button.active{background:#9a7398;color:#fff;border-color:#9a7398}.card{position:relative;overflow:hidden;background:radial-gradient(circle at 12% 14%,#f5d8e3 0 6%,transparent 6.5%),radial-gradient(circle at 88% 83%,#d6e9e7 0 9%,transparent 9.5%),linear-gradient(150deg,#fffaf0,#f6ecf5 55%,#e8f4ef);box-shadow:0 35px 100px #263f4a66}.card:before,.card:after{content:"";position:absolute;border-radius:50%;pointer-events:none}.card:before{width:70px;height:70px;right:-28px;top:32px;border:1px solid #ddb9ca80}.card:after{width:38px;height:38px;left:-14px;bottom:44px;border:1px solid #e4bd6a80}.card h2{color:#344d5b}.card p{color:#6f7382}.card a.control{background:linear-gradient(100deg,#efb64b,#f4c86f);border-color:#f1c168}.card .tag{color:#b17c37}

<body>
<canvas id="tank" aria-label="水槽の砂に隠された金色の鍵を探すゲーム。砂をタップして掘ります。"></canvas>
<header><h1>ニモ、金色の鍵を盗む</h1><p>本人は、宝物にしただけだと言っています。</p></header>
<div class="hud"><div class="pill">鍵：<strong id="keyState">行方不明 · 0/3</strong></div><div class="pill">ニモ：<span id="nemoState">宝物を守ってる</span></div></div>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="instructions" id="instructions">水槽の底をタップして砂を掘る</div>
<footer><button id="distract" type="button">網で気を引く</button><button id="restart" type="button">最初から</button><a class="control" href="nemo-sandkeeper.html">砂番へ戻る</a></footer>
<div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="card"><div class="key" aria-hidden="true"><svg viewBox="0 0 210 105"><defs><linearGradient id="caseGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".25" stop-color="#e2a038"/><stop offset=".58" stop-color="#ffda76"/><stop offset="1" stop-color="#9b571e"/></linearGradient></defs><path fill="url(#caseGold)" fill-rule="evenodd" d="M46 14a38 38 0 1 0 0 76 38 38 0 0 0 0-76Zm0 14a24 24 0 1 1 0 48 24 24 0 0 1 0-48Zm-4 13c5-9 12-4 10 3-2 4-5 6-6 10-1-4-4-6-6-10-1-1 0-2 2-3Z"/><path fill="url(#caseGold)" d="M72 44h105v17H72zM129 58h16v22h-16zM149 58h14v29h-14zM167 58h13v18h-13zM184 44h18v17h-18z"/><text x="94" y="57" text-anchor="middle" fill="#754318" font-size="10" font-weight="800" font-family="Arial,sans-serif">10718</text></svg></div><div class="tag">Third recovery · case closed</div><h2 id="winTitle">鍵、やっと回収。</h2><p>二回も隠し直したニモは、「貸してただけ」という顔をしています。</p><div class="actions"><a class="control" href="after-the-key.html">この鍵で部屋を開ける</a><button id="again" type="button">もう一度盗ませる</button></div></div>
</div>
<script>
(() => {
'use strict';
const canvas=document.querySelector('#tank'),ctx=canvas.getContext('2d');
const message=document.querySelector('#message'),keyState=document.querySelector('#keyState'),nemoState=document.querySelector('#nemoState'),distractButton=document.querySelector('#distract'),instructions=document.querySelector('#instructions'),win=document.querySelector('#win');
let w=0,h=0,sandY=0,t=0,last=0,bubbles=[],dust=[],holes=[],keyX=0,keyProgress=0,recoveries=0,relocations=0,cleanTimer=0,distraction=0,cooldown=0,bump=0,won=false,snatching=false,msgTimer=0;
const fish={x:0,y:0,angle:0},net={x:0,y:0,kick:0};
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resize(){const ow=w||innerWidth,oh=h||innerHeight;w=innerWidth;h=innerHeight;sandY=h*.77;const d=Math.min(devicePixelRatio||1,2);canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0);fish.x=fish.x?fish.x/ow*w:w*.72;fish.y=fish.y?fish.y/oh*h:h*.42;net.x=w*.18;net.y=h*.35;holes.forEach(p=>p.x=p.x/ow*w);if(keyX)keyX=keyX/ow*w;}
function say(text,time=2.2){message.textContent=text;message.classList.add('show');msgTimer=time;}
function hideMessage(){message.classList.remove('show')}
function newKey(farFrom=0){let next;do{next=rand(Math.max(55,w*.1),Math.min(w-55,w*.9));}while(farFrom&&Math.abs(next-farFrom)<w*.34);keyX=next;keyProgress=0;keyState.textContent='行方不明 · '+recoveries+'/3';}
function reset(){holes=[];dust=[];recoveries=0;relocations=0;cleanTimer=0;distraction=0;cooldown=0;bump=0;won=false;snatching=false;win.classList.remove('show');distractButton.disabled=false;distractButton.classList.remove('active');distractButton.textContent='網で気を引く';instructions.textContent='水槽の底をタップして砂を掘る';nemoState.textContent='宝物を守ってる';newKey();say('金色の鍵が、水槽から消えました。',2.6);}
function snatchAgain(){snatching=true;recoveries++;keyState.textContent='見つけた · '+recoveries+'/3';nemoState.textContent='奪い返しに行く';say(recoveries===1?'見つけた！ ……ニモが来た。':'また見つけた！ ……またニモが来た。',2.3);setTimeout(()=>{const old=keyX;holes=[];newKey(old);snatching=false;nemoState.textContent='別の場所へ隠した';say(recoveries===1?'鍵を奪って、別の砂へ埋め直した！':'二回目も奪われた。次こそ回収。',3);},900);}
function dig(x){if(won||snatching)return;holes.push({x:clamp(x,35,w-35),r:rand(17,25),age:0});if(holes.length>12)holes.shift();for(let i=0;i<12;i++)dust.push({x:x+rand(-12,12),y:sandY+2,vx:rand(-36,36),vy:rand(-70,-22),life:1});const d=Math.abs(x-keyX);if(d<43){keyProgress++;keyState.textContent=keyProgress===1?'端が見えた · '+recoveries+'/3':keyProgress===2?'もう少し · '+recoveries+'/3':'発見 · '+(recoveries+1)+'/3';say(keyProgress<3?'金色だ！ あと'+(3-keyProgress)+'回！':'見つけた！');if(keyProgress>=3){if(recoveries<2)snatchAgain();else victory();}}else if(d<95){say('砂の下で、何か光った。');}else if(d<175){say('こっちの方が少し怪しい。');}else{say('砂。普通の砂。');}}
function relocate(){if(won||snatching)return;relocations++;const old=keyX;newKey(old);holes=[];say(relocations===1?'ニモが鍵をくわえて、別の場所へ埋めた。':'また場所を変えた。しっかり隠している。',3);nemoState.textContent='証拠を隠滅';}
function victory(){won=true;recoveries=3;distraction=0;distractButton.disabled=true;keyState.textContent='回収 · 3/3';instructions.textContent='三回目で金色の鍵を取り返した';nemoState.textContent='貸してただけ';setTimeout(()=>win.classList.add('show'),700);}
distractButton.onclick=()=>{if(cooldown>0||won)return;distraction=6;cooldown=12;bump=0;distractButton.classList.add('active');distractButton.textContent='網に夢中 · 6';nemoState.textContent='網に激怒';say('今のうちに砂を掘る！',2);};
document.querySelector('#restart').onclick=reset;document.querySelector('#again').onclick=reset;
canvas.onpointerdown=e=>{if(e.clientY>sandY-32)dig(e.clientX);else if(!won)say('鍵は水の中ではなく、砂の中。');};
function ellipse(x,y,rx,ry,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();}
function drawFish(angry){ctx.save();ctx.translate(fish.x,fish.y);const left=Math.cos(fish.angle)<0;ctx.scale((left?-1:1)*1.16,1.16);ctx.rotate(Math.sin(fish.angle)*.13);const wiggle=Math.sin(t*13)*4;ctx.fillStyle='#f0784b';ctx.strokeStyle='#745044';ctx.lineWidth=1.35;ctx.beginPath();ctx.moveTo(-23,0);ctx.lineTo(-43,-16+wiggle);ctx.quadraticCurveTo(-38,0,-43,16+wiggle);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#f4865a';ctx.beginPath();ctx.moveTo(-18,-12);ctx.quadraticCurveTo(0,-34,17,-15);ctx.closePath();ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(0,0,32,21,0,0,Math.PI*2);ctx.fillStyle='#ff9564';ctx.fill();ctx.stroke();ctx.save();ctx.clip();for(const x of [-18,4,22]){ctx.fillStyle='#51423c';ctx.fillRect(x-6,-23,12,46);ctx.fillStyle='#fff4dc';ctx.fillRect(x-3.5,-23,7,46);}ctx.restore();ellipse(-2,11,9,5,'#f47a50');ellipse(22,-5,6.3,6.5,'#fffaf0');ellipse(24,-5,2.8,3.3,'#263e45');ellipse(25,-6,1.1,1.1,'white');ellipse(18,7,4.5,2.4,'#f7a09a88');ctx.strokeStyle='#754a42';ctx.lineWidth=1.5;ctx.beginPath();if(angry){ctx.moveTo(29,7);ctx.quadraticCurveTo(33,3,36,6);}else{ctx.moveTo(29,5);ctx.quadraticCurveTo(33,8,36,5);}ctx.stroke();if(angry){ctx.strokeStyle='#9d5361';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(16,-13);ctx.lineTo(27,-9);ctx.stroke();ctx.fillStyle='#c65f6c';ctx.font='bold 14px system-ui';ctx.fillText('!',8,-33-Math.sin(t*6)*3);}ctx.restore();}
function drawDecor(){ctx.save();ellipse(w*.07,sandY+18,55,27,'#b99ab8');ellipse(w*.115,sandY+14,35,24,'#d6b3c7');ellipse(w*.035,sandY+8,28,18,'#8e91b2');for(let i=0;i<5;i++){ctx.strokeStyle=i%2?'#d78da7':'#a78bb5';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();const x=w*.12+i*11;ctx.moveTo(x,sandY+18);ctx.bezierCurveTo(x-16,sandY-12,x+16,sandY-38,x+(i-2)*6,sandY-65-rand(0,0));ctx.stroke();}ctx.fillStyle='#f2bd79';ctx.beginPath();const sx=w*.78,sy=sandY+21;for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI*.8,r=i%2?9:23;ctx.lineTo(sx+Math.cos(a)*r,sy+Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.strokeStyle='#d89561';ctx.lineWidth=1;ctx.stroke();ctx.restore();}
function drawNet(){const x=net.x+net.kick,y=net.y;ctx.strokeStyle='#68898b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x+25,-20);ctx.lineTo(x,y-30);ctx.stroke();ctx.fillStyle='#f6ffff36';ctx.strokeStyle='#52797c';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-24,y-30);ctx.lineTo(x+24,y-30);ctx.lineTo(x+20,y+17);ctx.quadraticCurveTo(x,y+37,x-20,y+17);ctx.closePath();ctx.fill();ctx.stroke();ctx.save();ctx.clip();ctx.strokeStyle='#719b9c88';ctx.lineWidth=.7;for(let i=-25;i<=25;i+=6){ctx.beginPath();ctx.moveTo(x+i,y-32);ctx.lineTo(x+i,y+35);ctx.stroke();}for(let i=-30;i<=35;i+=6){ctx.beginPath();ctx.moveTo(x-27,y+i);ctx.lineTo(x+27,y+i);ctx.stroke();}ctx.restore();}
function drawKey(){if(keyProgress<=0||won)return;ctx.save();ctx.translate(keyX,sandY+9-keyProgress*7);ctx.rotate(-.14);ctx.globalAlpha=.38+keyProgress*.2;ctx.strokeStyle='#9c6519';ctx.fillStyle='#efb542';ctx.lineWidth=2;ctx.beginPath();ctx.arc(-20,0,11,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#d99b30';ctx.beginPath();ctx.arc(-20,0,5,0,Math.PI*2);ctx.fillStyle='#d4c39d';ctx.fill();ctx.fillStyle='#efb542';ctx.fillRect(-10,-3,42,7);ctx.fillRect(18,2,7,11);ctx.fillRect(28,2,7,16);ctx.restore();}
function frame(now){const dt=Math.min((now-last)/1000||.016,.05);last=now;t+=dt;msgTimer=Math.max(0,msgTimer-dt);if(msgTimer===0)hideMessage();net.kick*=Math.exp(-dt*8);cooldown=Math.max(0,cooldown-dt);if(distraction>0){distraction=Math.max(0,distraction-dt);distractButton.textContent='網に夢中 · '+Math.ceil(distraction);if(distraction===0){distractButton.classList.remove('active');distractButton.textContent=cooldown>0?'網は休憩 · '+Math.ceil(cooldown):'網で気を引く';nemoState.textContent='巡回再開';}}else if(cooldown>0)distractButton.textContent='網は休憩 · '+Math.ceil(cooldown);else if(!won){distractButton.textContent='網で気を引く';distractButton.disabled=false;}
const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#faf6ff');bg.addColorStop(.48,'#e2f4f2');bg.addColorStop(.78,'#c9e8e6');bg.addColorStop(1,'#b8dcd9');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);ctx.fillStyle='#ffffff38';for(let i=0;i<4;i++){const x=(i*.32-.2)*w+Math.sin(t*.13)*12;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+w*.1,0);ctx.lineTo(x+w*.4,h);ctx.lineTo(x+w*.2,h);ctx.fill();}for(const b of bubbles){b.y-=b.speed*dt;if(b.y<-10){b.y=sandY;b.x=rand(10,w-10);}ctx.strokeStyle=b.golden?'#f0bd6688':'#ffffffb5';ctx.lineWidth=b.golden?1.4:1;ctx.beginPath();ctx.arc(b.x+Math.sin(t+b.phase)*5,b.y,b.r,0,Math.PI*2);ctx.stroke();}
ctx.fillStyle='#f3ddbc';ctx.beginPath();ctx.moveTo(0,sandY);for(let x=0;x<=w+20;x+=20)ctx.lineTo(x,sandY+Math.sin(x*.015)*3);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<40;i++){const x=(i*97.3)%w,y=sandY+12+(i*39.7)%Math.max(15,h-sandY-95);ellipse(x,y,1.4,.8,'#bd9e8a44');}drawDecor();ctx.strokeStyle='#73a193';ctx.lineWidth=5;ctx.lineCap='round';for(let j=0;j<4;j++){const x=w-35+j*7;ctx.beginPath();ctx.moveTo(x,sandY);ctx.bezierCurveTo(x-15,sandY-30,x+Math.sin(t*1.5+j)*10,sandY-65,x-5,sandY-85+j*12);ctx.stroke();}
holes.forEach(p=>{p.age+=dt;ellipse(p.x,sandY+7,p.r+7,p.r*.32,'#ac9876');ellipse(p.x,sandY+4,p.r,p.r*.24,'#8d7b60');});drawKey();for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;ellipse(p.x,p.y,2.4,2,'rgba(176,151,104,'+Math.max(0,p.life)+')');if(p.life<=0)dust.splice(i,1);}
let target,angry=false;if(snatching){target={x:keyX,y:sandY-24};angry=true;}else if(distraction>0){target={x:net.x-38,y:net.y};angry=true;}else if(holes.length&&!won){const latest=holes[holes.length-1];target={x:latest.x,y:sandY-22,hole:latest};angry=true;}else{target={x:w*.52+Math.sin(t*.42)*w*.28,y:h*.43+Math.sin(t*.67)*h*.09};}
const dx=target.x-fish.x,dy=target.y-fish.y,dist=Math.hypot(dx,dy),speed=distraction>0?230:target.hole?150:55;if(dist>2){fish.x+=dx/dist*Math.min(speed*dt,dist);fish.y+=dy/dist*Math.min(speed*dt,dist);fish.angle=Math.atan2(dy,dx);}if(distraction>0&&dist<10){net.kick=13;bump++;}if(target.hole&&dist<8){cleanTimer+=dt;if(cleanTimer>.62){cleanTimer=0;const near=Math.abs(target.hole.x-keyX)<55;holes.splice(holes.indexOf(target.hole),1);if(near&&keyProgress>0&&relocations<2)relocate();else{nemoState.textContent='砂を修復';if(!msgTimer)say('掘った場所を、勝手に直された。',1.5);}}}else cleanTimer=0;if(distraction>0)drawNet();drawFish(angry);requestAnimationFrame(frame);}
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>last=performance.now());resize();for(let i=0;i<25;i++)bubbles.push({x:rand(0,w),y:rand(0,sandY),r:rand(1.5,5),speed:rand(10,26),phase:rand(0,6),golden:i%7===0});reset();requestAnimationFrame(frame);
})();
</script>
</body>
