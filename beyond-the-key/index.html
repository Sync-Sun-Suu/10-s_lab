for(let row=0;row<23;row++){const py=r*.14+row*r*.046;const amp=r*(.008+row*.0007);c.beginPath();for(let x=-r;x<=r;x+=r/32){const yy=py+Math.sin(x/r*9+row*.7+t*.0003)*amp+Math.sin(x/r*17-row*.5+t*.00018)*amp*.35;x===-r?c.moveTo(x,yy):c.lineTo(x,yy);}c.strokeStyle=row<9?'rgba(231,211,157,.21)':'rgba(138,188,190,.22)';c.lineWidth=r*.006;c.stroke();}
c.save();c.globalAlpha=.38;c.strokeStyle='#ffe5ae';c.lineCap='round';for(let i=0;i<15;i++){const py=r*.08+i*r*.042;const spread=r*(.035+i*.005);const ox=Math.sin(i*9.3+t*.00015)*spread;c.beginPath();c.moveTo(r*.32-spread+ox,py);c.lineTo(r*.32+spread+ox,py);c.lineWidth=r*.009;c.stroke();}c.restore();
const boatX=-r*.27+Math.sin(t*.00032)*r*.015,boatY=r*.37+Math.sin(t*.00075)*r*.012;c.save();c.translate(boatX,boatY);c.rotate(Math.sin(t*.00065)*.025);c.fillStyle='#eadfc7';c.beginPath();c.moveTo(-r*.15,0);c.lineTo(r*.15,0);c.lineTo(r*.08,r*.055);c.lineTo(-r*.085,r*.055);c.closePath();c.fill();c.strokeStyle='#d4bd82';c.lineWidth=r*.008;c.beginPath();c.moveTo(0,-r*.24);c.lineTo(0,0);c.stroke();c.fillStyle='#f5eddb';c.beginPath();c.moveTo(-r*.008,-r*.23);c.lineTo(-r*.115,-r*.015);c.lineTo(-r*.008,-r*.035);c.closePath();c.fill();c.fillStyle='#c4d5d1';c.beginPath();c.moveTo(r*.009,-r*.18);c.lineTo(r*.09,-r*.025);c.lineTo(r*.009,-r*.025);c.closePath();c.fill();c.restore();
for(let i=0;i<10;i++){const x=Math.sin(i*7.23)*r*.78,y=-r*.79+(i%5)*r*.115;const alpha=.3+.2*Math.sin(t*.001+i);c.fillStyle='rgba(249,228,177,'+alpha+')';c.beginPath();c.arc(x,y,r*.005,0,Math.PI*2);c.fill();}
if(stars.length>1){c.strokeStyle='#f4d99833';c.lineWidth=r*.0035;c.beginPath();stars.forEach((s,i)=>i?c.lineTo(s.x*r,s.y*r):c.moveTo(s.x*r,s.y*r));c.stroke();}stars.forEach((s,i)=>starShape(c,s.x*r,s.y*r,r*(i===stars.length-1?.035:.024),.8+.15*Math.sin(t*.0012+i)));
if(!still&&!reduced){sparkles=sparkles.filter(p=>t-p.at<1800);sparkles.forEach(p=>{const progress=(t-p.at)/1800;c.strokeStyle='rgba(255,229,169,'+((1-progress)*.6)+')';c.lineWidth=r*.006;c.beginPath();c.arc(p.x*r,p.y*r,r*(.02+progress*.21),0,Math.PI*2);c.stroke();});}c.restore();
c.save();c.translate(cx,cy);const glass=c.createLinearGradient(-r,-r,r,r);glass.addColorStop(0,'#f8fbecbb');glass.addColorStop(.32,'#ffffff22');glass.addColorStop(.7,'#c2e6e533');glass.addColorStop(1,'#f6e1ab99');c.strokeStyle=glass;c.lineWidth=r*.026;c.beginPath();c.arc(0,0,r,0,Math.PI*2);c.stroke();c.strokeStyle='#ffffff22';c.lineWidth=r*.035;c.beginPath();c.arc(0,0,r*.91,3.48,4.16);c.stroke();c.strokeStyle='#ffffff77';c.lineWidth=r*.018;c.beginPath();c.arc(0,0,r*.92,3.6,4.05);c.stroke();c.restore();}
function draw(t){const w=242,h=266,dpr=Math.min(window.devicePixelRatio||1,2);if(canvas.width!==w*dpr){canvas.width=w*dpr;canvas.height=h*dpr;}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);const light=ctx.createRadialGradient(121,118,45,121,118,123);light.addColorStop(0,'#e6c77b00');light.addColorStop(.8,'#e6c77b15');light.addColorStop(1,'#e6c77b00');ctx.fillStyle=light;ctx.fillRect(0,0,w,h);drawSea(ctx,121,115,101,reduced?0:t);const base=ctx.createLinearGradient(0,217,0,248);base.addColorStop(0,'#ead7a2');base.addColorStop(.3,'#b7975e');base.addColorStop(.6,'#f5e3b2');base.addColorStop(1,'#9a7944');ctx.fillStyle=base;ctx.beginPath();ctx.ellipse(121,218,64,9,0,0,Math.PI*2);ctx.fill();ctx.fillRect(57,218,128,13);ctx.beginPath();ctx.ellipse(121,232,64,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8c713e';ctx.font='8px Georgia,serif';ctx.textAlign='center';ctx.fillText('10718',121,231);}
function loop(t){if(document.hidden||!['opening','open','closing'].includes(state)){raf=0;return;}if(t-lastFrame>31){lastFrame=t;frameTime=t;draw(t);}raf=requestAnimationFrame(loop);}
function startDrawing(){draw(performance.now());if(!reduced&&!raf)raf=requestAnimationFrame(loop);}
function stopDrawing(){if(raf)cancelAnimationFrame(raf);raf=0;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopDrawing();stopAllAudio();}else if(state==='opening'||state==='open')startDrawing();});
function saveCard(){if(state!=='open')return;const card=document.createElement('canvas');card.width=1400;card.height=1800;const c=card.getContext('2d');c.fillStyle='#f5f0e7';c.fillRect(0,0,1400,1800);c.strokeStyle='#c8b58b';c.lineWidth=2;c.strokeRect(55,55,1290,1690);c.textAlign='center';c.fillStyle='#9b8257';c.font='19px sans-serif';c.fillText('10718  /  FOR SUMIE',700,180);drawSea(c,700,740,410,frameTime||0,true);c.fillStyle='#283e48';c.font='46px serif';c.fillText('ひとしずくの海',700,1320);c.fillStyle='#747970';c.font='25px serif';c.fillText('Sumieに見つけてほしくて、',700,1400);c.fillText('海をひとしずく隠しておいたよ。',700,1450);c.fillText('星を置くたび、10の「大好き」もひとつ。',700,1500);c.font='27px serif';c.fillText('— 10',700,1595);c.fillStyle='#a08d6b';c.font='17px serif';c.fillText('TO BE CONTINUED.',700,1680);const a=document.createElement('a');a.download='10718-a-drop-of-sea.png';a.href=card.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();announce('今の星が入った海のカードを保存します。');}
$('save').addEventListener('click',saveCard);
draw(0);
})();
