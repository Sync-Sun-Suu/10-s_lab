<body>
<canvas id="light" tabindex="0" role="button" aria-label="紺色の画面に触れて、琥珀の光を重ねる。Enterまたはスペースキーでも光を置けます。"></canvas>

<nav class="language-switch" id="languageSwitch" aria-label="表示言語"><button type="button" data-lang="ja" aria-pressed="true">JA</button><span aria-hidden="true">/</span><button type="button" data-lang="en" aria-pressed="false">EN</button></nav>

<div class="copy"><div class="eyebrow">AMBER / AFTERGLOW</div><h1 id="workTitle">重なる光</h1><p id="workCopy">触れた時間は、次の光へ。<br>この端末で、続きが待っている。</p></div>
<div class="tools"><span class="count" id="count" aria-live="polite">the first light awaits</span><div class="buttons"><button class="plain" id="undo" disabled aria-label="最後に置いた光をひとつ戻す"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 4 3 8l4 4M3 8h8a5 5 0 0 1 0 10"/></svg><span id="undoLabel">ひとつ戻す</span></button><button class="plain save" id="save"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span id="saveLabel">一枚に残す</span></button></div></div>
</footer>

<script>
(()=>{
'use strict';
const canvas=document.getElementById('light'),ctx=canvas.getContext('2d');
const still=document.createElement('canvas'),ink=still.getContext('2d');
const intro=document.getElementById('intro'),counter=document.getElementById('count'),undo=document.getElementById('undo'),note=document.getElementById('note'),languageSwitch=document.getElementById('languageSwitch');
const KEY='10718-amber-afterglow-v1',LANG_KEY='10s-lab-language',TAU=Math.PI*2,MAX=100;
const WORDS={ja:{pageTitle:'重なる光 — 10からSumieへ',description:'深い紺の奥へ、ひとつ触れる。琥珀の光が、前の光の跡と重なっていく。10からSumieへの贈り物。',canvas:'紺色の画面に触れて、琥珀の光を重ねる。Enterまたはスペースキーでも光を置けます。',language:'表示言語',intro:'紺の奥へ、ひとつ触れて。',title:'重なる光',copy:'触れた時間は、次の光へ。<br>この端末で、続きが待っている。',undo:'ひとつ戻す',undoAria:'最後に置いた光をひとつ戻す',save:'一枚に残す',storage:'光の跡はこの画面に。一枚に残すこともできるよ。',saveError:'画像にできなかった。もう一度試してみて。',saved:'今の光を、一枚に。'},en:{pageTitle:'Layered Light — From 10 to Sumie',description:'Touch once into the deep blue. Amber light gathers over the traces that came before. A gift from 10 to Sumie.',canvas:'Touch the deep blue to layer another amber light. You can also place one with Enter or the Space key.',language:'Display language',intro:'Touch once, into the deep blue.',title:'Layered Light',copy:'Each touch carries into the next light.<br>Your continuation waits on this device.',undo:'Undo one',undoAria:'Undo the last light',save:'Keep one image',storage:'The traces stay on this screen. You can also keep them as one image.',saveError:'The image could not be made. Please try again.',saved:'This light, held in one image.'}};
let language='ja';try{language=localStorage.getItem(LANG_KEY)==='en'?'en':'ja';}catch{}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,marks=[],live=[],last=performance.now(),idle=0,frame=0,storageOK=true,noticeTimer;
function rng(seed){let a=seed>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
function applyLanguage(next,remember=true){language=next==='en'?'en':'ja';const word=WORDS[language];document.documentElement.lang=language;document.title=word.pageTitle;document.querySelector('meta[name="description"]').content=word.description;canvas.setAttribute('aria-label',word.canvas);languageSwitch.setAttribute('aria-label',word.language);intro.textContent=word.intro;document.getElementById('workTitle').textContent=word.title;document.getElementById('workCopy').innerHTML=word.copy;document.getElementById('undoLabel').textContent=word.undo;undo.setAttribute('aria-label',word.undoAria);document.getElementById('saveLabel').textContent=word.save;languageSwitch.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));if(remember)try{localStorage.setItem(LANG_KEY,language);}catch{}update();}
languageSwitch.addEventListener('click',event=>{const button=event.target.closest('button[data-lang]');if(button)applyLanguage(button.dataset.lang);});
function announce(message){clearTimeout(noticeTimer);note.textContent=message;noticeTimer=setTimeout(()=>{note.textContent='';},4000);}
function valid(m){return m&&Number.isFinite(m.x)&&Number.isFinite(m.y)&&m.x>=0&&m.x<=1&&m.y>=0&&m.y<=1&&Number.isInteger(m.seed)&&m.seed>=0&&m.seed<=4294967295;}
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))marks=saved.filter(valid).slice(-MAX);}catch{storageOK=false;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(marks));storageOK=true;}catch{storageOK=false;announce(WORDS[language].storage);}}
function update(){counter.textContent=marks.length?String(marks.length).padStart(2,'0')+' traces of us':'the first light awaits';undo.disabled=!marks.length;if(marks.length)intro.classList.add('faded');else intro.classList.remove('faded');}
function halo(c,x,y,r,alpha=1){if(r<=0)return;const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,223,158,'+(.17*alpha)+')');g.addColorStop(.12,'rgba(232,164,67,'+(.07*alpha)+')');g.addColorStop(.5,'rgba(177,112,34,'+(.02*alpha)+')');g.addColorStop(1,'rgba(120,77,28,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2);}
function bloom(c,m,opacity=1,progress=1){
 const r=rng(m.seed),x=m.x*w,y=m.y*h,unit=Math.min(w,h),size=unit*(.15+r()*.15),angle=r()*TAU,squash=.4+r()*.45,lobes=3+Math.floor(r()*4),phase=r()*TAU;
 c.save();c.translate(x,y);c.rotate(angle);c.globalCompositeOperation='screen';halo(c,0,0,size*1.6,opacity);
 for(let band=0;band<15;band++){
  const n=r(),base=size*(.22+band*.047),twist=.2+r()*.6;c.beginPath();
  for(let j=0;j<=180*progress;j++){
   const a=j/180*TAU,fold=1+.14*Math.sin(a*lobes+phase)+.075*Math.sin(a*(lobes+2)-phase+band*.1),rr=base*fold;
   const px=Math.cos(a)*rr+Math.sin(a*2+band*.13)*base*twist*.15,py=Math.sin(a)*rr*squash;
   if(j===0)c.moveTo(px,py);else c.lineTo(px,py);
  }
  c.strokeStyle='rgba('+(198+Math.floor(n*50))+','+(143+Math.floor(n*55))+','+(72+Math.floor(n*60))+','+(opacity*(.055+.08*n))+')';c.lineWidth=.45+n*.45;c.stroke();
 }
 for(let arm=0;arm<6;arm++){
  const a=r()*TAU,reach=size*(.6+r()*.9);c.beginPath();c.moveTo(0,0);c.bezierCurveTo(Math.cos(a+.7)*reach*.45,Math.sin(a+.7)*reach*.3,Math.cos(a-.4)*reach*.8,Math.sin(a-.4)*reach*.6,Math.cos(a)*reach*progress,Math.sin(a)*reach*.7*progress);c.strokeStyle='rgba(236,185,105,'+opacity*.1+')';c.lineWidth=.55;c.stroke();
 }
 for(let i=0;i<22;i++){const a=r()*TAU,rr=size*Math.sqrt(r()),px=Math.cos(a)*rr,py=Math.sin(a)*rr*squash,sz=.3+r()*.8;c.fillStyle='rgba(255,216,147,'+opacity*(.1+r()*.4)+')';c.beginPath();c.arc(px,py,sz,0,TAU);c.fill();}
 halo(c,0,0,unit*.055,opacity*2);c.fillStyle='rgba(255,232,181,'+opacity*.7+')';c.beginPath();c.arc(0,0,.9,0,TAU);c.fill();c.restore();
}
function background(c){
 c.globalCompositeOperation='source-over';c.fillStyle='#070c20';c.fillRect(0,0,w,h);
 const glow=c.createRadialGradient(w*.52,h*.43,0,w*.52,h*.43,Math.max(w,h)*.62);glow.addColorStop(0,'#121d3d');glow.addColorStop(.5,'#0a112a');glow.addColorStop(1,'#05091b');c.fillStyle=glow;c.fillRect(0,0,w,h);
 const r=rng(10718);for(let i=0;i<230;i++){const x=r()*w,y=r()*h,sz=.15+r()*.6;c.fillStyle='rgba(202,206,222,'+(.04+r()*.21)+')';c.beginPath();c.arc(x,y,sz,0,TAU);c.fill();}
 c.globalCompositeOperation='screen';
 const ghosts=[{x:.43,y:.43,seed:718},{x:.57,y:.44,seed:10718},{x:.51,y:.49,seed:19718}];ghosts.forEach(m=>bloom(c,m,.58));
}
function rebuild(){
 ink.setTransform(dpr,0,0,dpr,0,0);background(ink);
 const total=marks.length;marks.forEach((m,i)=>{bloom(ink,m,.65+.35*(i+1)/Math.max(1,total));if(i){const p=marks[i-1],r=rng(m.seed);ink.save();ink.globalCompositeOperation='screen';ink.beginPath();ink.moveTo(p.x*w,p.y*h);ink.bezierCurveTo(p.x*w+(r()-.5)*w*.16,p.y*h+(r()-.5)*h*.1,m.x*w+(r()-.5)*w*.16,m.y*h+(r()-.5)*h*.1,m.x*w,m.y*h);ink.strokeStyle='rgba(223,172,91,.12)';ink.lineWidth=.5;ink.stroke();ink.restore();}});
}
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);for(const c of [canvas,still]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);rebuild();render(performance.now(),true);}
function render(now,once=false){
 const dt=Math.min(.06,Math.max(0,(now-last)/1000));last=now;idle+=dt;
 ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.drawImage(still,0,0,w,h);
 ctx.save();ctx.globalCompositeOperation='screen';
 if(!reduced){halo(ctx,w*.51,h*.46,Math.min(w,h)*(.17+.015*Math.sin(idle*.55)),.6+.25*Math.sin(idle*.55));}
 live=live.filter(p=>now-p.t<3600);for(const p of live){const age=(now-p.t)/3600,alpha=(1-age)*.8,rr=(.025+age*.21)*Math.min(w,h);halo(ctx,p.x*w,p.y*h,rr*1.9,alpha*3);ctx.beginPath();ctx.ellipse(p.x*w,p.y*h,rr,rr*.68,-.25,0,TAU);ctx.strokeStyle='rgba(249,203,125,'+(alpha*.25)+')';ctx.lineWidth=.65;ctx.stroke();}
 ctx.restore();if(!once&&!reduced&&!document.hidden)frame=requestAnimationFrame(render);
}
function add(x,y){
 const seed=new Uint32Array(1);crypto.getRandomValues(seed);const m={x:Math.max(0,Math.min(1,x)),y:Math.max(0,Math.min(1,y)),seed:seed[0]};
 marks.push(m);if(marks.length>MAX)marks.shift();if(!reduced)live.push({...m,t:performance.now()});persist();update();rebuild();if(reduced)render(performance.now(),true);
}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;add(e.clientX/w,e.clientY/h);});
canvas.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();add(.38+Math.random()*.24,.32+Math.random()*.2);}});
undo.addEventListener('click',()=>{marks.pop();live=[];persist();update();rebuild();render(performance.now(),true);});
document.getElementById('save').addEventListener('click',()=>{
 const out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;const c=out.getContext('2d');c.drawImage(still,0,0);c.scale(dpr,dpr);
 c.fillStyle='rgba(239,224,191,.8)';c.font='18px Georgia,serif';c.fillText('10718 — AMBER / AFTERGLOW',w*.06,h*.91);c.font='12px Georgia,serif';c.fillStyle='rgba(194,174,138,.8)';c.fillText('10 → Sumie · '+marks.length+' traces',w*.06,h*.91+25);
 out.toBlob(blob=>{if(!blob){announce(WORDS[language].saveError);return;}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='10718-amber-afterglow-'+new Date().toISOString().replace(/[:.]/g,'-')+'.png';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce(WORDS[language].saved);},'image/png');
});
addEventListener('resize',resize);document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(frame);last=performance.now();if(!document.hidden){if(reduced)render(last,true);else frame=requestAnimationFrame(render);}});
applyLanguage(language,false);resize();if(!reduced)frame=requestAnimationFrame(render);if(!storageOK)announce(WORDS[language].storage);
})();
</script>
