      <path d="M77 11c8 12 11 25 8 39-3 15-1 27 8 39l18-3c-9-14-11-25-7-37 4-13 2-26-5-37Z" fill="#f7eed7" stroke="#241d20" stroke-width="5"/>
      <path d="M106 15c8 12 10 25 7 37-3 14 1 24 8 31l13-5c-8-11-10-20-7-30 3-12-1-22-8-30Z" fill="#f7eed7" stroke="#241d20" stroke-width="5"/>
      <rect x="38" y="10" width="115" height="80" fill="#fff" opacity=".11" filter="url(#grain)"/>
      <path d="M55 34c20-13 53-15 77-3" fill="none" stroke="#ffd27b" stroke-width="1.2" opacity=".48"/>
      <path d="M62 68c22 9 48 8 68-2" fill="none" stroke="#6e261f" stroke-width="1.1" opacity=".45"/>
      <g fill="#ffd789" opacity=".35">
        <circle cx="66" cy="32" r="1"/><circle cx="72" cy="69" r=".8"/><circle cx="108" cy="29" r=".7"/><circle cx="113" cy="70" r=".9"/><circle cx="137" cy="55" r=".65"/>
