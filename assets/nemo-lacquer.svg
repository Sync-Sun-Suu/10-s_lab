    <path d="M93 55c5 4 7 8 7 13" fill="none" stroke="#f7b36e" stroke-width="1" opacity=".7"/>
    <circle cx="136" cy="41" r="4.25" fill="#f5e8cd" stroke="#241d20" stroke-width="1.5"/>
    <circle cx="136.6" cy="41.1" r="2.45" fill="url(#eye)"/>
    <circle cx="137.4" cy="40.1" r=".72" fill="#fffbed"/>
    <path d="M146 54c2 .3 3.3-.1 4.2-1" fill="none" stroke="#241d20" stroke-width="1.35"/>
