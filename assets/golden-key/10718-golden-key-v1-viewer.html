function shader(t,s){let x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}const prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const raw=Uint8Array.from(atob(DATA),c=>c.charCodeAt(0)).buffer,dv=new DataView(raw),count=dv.getUint32(80,true),pos=new Float32Array(count*9),nor=new Float32Array(count*9);let o=84,k=0,min=[1e9,1e9,1e9],max=[-1e9,-1e9,-1e9];for(let i=0;i<count;i++){let nn=[dv.getFloat32(o,true),dv.getFloat32(o+4,true),dv.getFloat32(o+8,true)];o+=12;for(let j=0;j<3;j++){for(let z=0;z<3;z++){let v=dv.getFloat32(o,true);o+=4;pos[k]=v;nor[k]=nn[z];min[z]=Math.min(min[z],v);max[z]=Math.max(max[z],v);k++}}o+=2}const ctr=min.map((v,i)=>(v+max[i])/2);for(let i=0;i<pos.length;i+=3){pos[i]-=ctr[0];pos[i+1]-=ctr[1];pos[i+2]-=ctr[2]}
function buf(name,data){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);let l=gl.getAttribLocation(prog,name);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,3,gl.FLOAT,false,0,0)}buf('p',pos);buf('n',nor);const ur=gl.getUniformLocation(prog,'r'),us=gl.getUniformLocation(prog,'s'),ua=gl.getUniformLocation(prog,'a');
let yaw=-.25,pitch=.72,zoom=1.62,pointers=new Map(),lastTap=0,pinch=0;function rot(){let cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);return new Float32Array([cy,sx*sy,-cx*sy,0,cx,sx,sy,-sx*cy,cx*cy])}function size(){let d=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d;gl.viewport(0,0,canvas.width,canvas.height)}return w/h}function draw(){let asp=size();gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.uniformMatrix3fv(ur,false,rot());gl.uniform1f(us,zoom/48);gl.uniform1f(ua,asp);gl.drawArrays(gl.TRIANGLES,0,count*3);requestAnimationFrame(draw)}
canvas.onpointerdown=e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(Date.now()-lastTap<330){yaw=-.25;pitch=.72;zoom=1.62}lastTap=Date.now()};canvas.onpointermove=e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let ps=[...pointers.values()];if(ps.length===1){yaw+=(e.clientX-old.x)*.012;pitch+=(e.clientY-old.y)*.012;pitch=Math.max(-1.45,Math.min(1.45,pitch))}else{let d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y);if(pinch)zoom*=d/pinch;pinch=d;zoom=Math.max(.75,Math.min(3.2,zoom))}};function up(e){pointers.delete(e.pointerId);pinch=0}canvas.onpointerup=up;canvas.onpointercancel=up;canvas.onwheel=e=>{e.preventDefault();zoom*=Math.exp(-e.deltaY*.001);zoom=Math.max(.75,Math.min(3.2,zoom))};draw();
